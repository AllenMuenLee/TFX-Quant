name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The x32 (32-bit) interpreter pin is retired — the legacy OCX API that forced
      # it (specifically its 32-bit-only quote control) is gone; SPARK API's Python
      # component ships an x64 build, matching windows-latest's default runner
      # architecture. See docs/adr/0001-python-version-and-runtime.md's addendum.
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pythonnet's CLR hosting needs the .NET 8 SDK on the host, not a pip package —
      # required to import YuantaSparkAPI.dll (see infrastructure/yuanta/README.md).
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy src

      # Proves the "dependencies point toward domain" layering rule mechanically —
      # the Python equivalent of .NET project references (see
      # docs/adr/0003-layering-and-event-threading-model.md).
      - name: Architecture/layering check (import-linter)
        run: lint-imports

      # No YuantaSparkAPI.dll is installed on this runner and none is required: the
      # real pythonnet-backed adapter only needs the DLL at runtime, not at
      # import/type-check time, and every test uses the mock/fake gateways. Every
      # feature must keep this property (see
      # src/tfx_quant/infrastructure/yuanta/README.md).
      - name: Test (pytest)
        run: pytest
