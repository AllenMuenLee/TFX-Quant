name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 32-bit (x86) Python 3.11 — the only supported interpreter bitness for this
      # project. The Yuanta quote OCX (YuantaQuote_v2.1.2.9.ocx) has no 64-bit build,
      # and the trade OCX is loaded at the same bitness as the interpreter. See
      # docs/maintenance.md ("API 版本矩陣") and src/tfx_quant/infrastructure/yuanta/README.md.
      - name: Setup Python 3.11 (x86)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x86"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy src

      # Proves the "dependencies point toward domain" layering rule mechanically.
      - name: Architecture/layering check (import-linter)
        run: lint-imports

      # No Yuanta OCX is installed on the runner and none is required: the real
      # adapters only need the vendor components at runtime, and every test uses the
      # mock/fake gateways. Every feature must keep this property.
      - name: Test (pytest)
        run: pytest
